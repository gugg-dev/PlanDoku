<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>PlanDoku – Studio F</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--dark:#1f2937;--acc:#dc2626;--acc2:#2563eb;--ok:#059669;
  --sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);--sal:env(safe-area-inset-left);--sar:env(safe-area-inset-right)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none}
header{background:var(--dark);color:#fff;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 8px calc(var(--sal) + 10px);display:flex;align-items:center;gap:8px;min-height:52px;flex:none}
header h1{font-size:17px;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:transparent;color:#fff;border:0;font-size:16px;padding:8px 10px;border-radius:8px;cursor:pointer}
header button:active{background:rgba(255,255,255,.15)}
main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;position:relative}
main.noscroll{overflow:hidden}
.wrap{max-width:1100px;margin:0 auto;padding:14px calc(var(--sar) + 14px) calc(var(--sab) + 24px) calc(var(--sal) + 14px)}
.row{display:flex;flex-wrap:wrap;align-items:center}.gap{gap:8px}.grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 14px;border-radius:10px;font-size:15px;cursor:pointer;min-height:44px;font-family:inherit;text-decoration:none}
.btn:active{filter:brightness(.92)}
.btn.primary{background:var(--dark);color:#fff;border-color:var(--dark)}
.btn.red{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.blue{background:var(--acc2);color:#fff;border-color:var(--acc2)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--acc);border-color:#fecaca}
.btn.sm{min-height:34px;padding:6px 10px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--card);border-radius:12px;border:1px solid var(--line);padding:12px}
.list{display:grid;gap:10px;margin-top:12px}
.item{cursor:pointer}.item .t{font-weight:600}.item .s{color:var(--muted);font-size:14px}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;padding:0 calc(var(--sar) + 6px) 0 calc(var(--sal) + 6px)}
.tabs button{flex:1;border:0;background:transparent;padding:12px 4px;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;font-family:inherit}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc);font-weight:600}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:12px}
.plancard{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.plancard .img{aspect-ratio:1.414;background:#fafafa center/contain no-repeat;border-bottom:1px solid var(--line)}
.plancard .meta{padding:8px 10px;display:flex;align-items:center;gap:6px}
.plancard .meta .t{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
label.f{display:block;margin:10px 0 4px;font-size:13px;color:var(--muted);font-weight:600}
input[type=text],input[type=date],input[type=datetime-local],select,textarea{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid #d1d5db;border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #d1d5db;border-radius:999px;padding:7px 12px;font-size:14px;background:#fff;cursor:pointer;user-select:none}
.chip.on{background:var(--dark);border-color:var(--dark);color:#fff}
/* Planansicht */
.pv{position:absolute;inset:0;overflow:hidden;touch-action:none;background:#d1d5db;user-select:none;-webkit-user-select:none}
.pv .inner{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.pv .inner img{display:block;pointer-events:none;-webkit-user-drag:none;box-shadow:0 2px 12px rgba(0,0,0,.25);background:#fff}
.pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;width:0;height:0}
.pin span{position:absolute;transform:translate(-50%,-50%);min-width:30px;height:30px;padding:0 6px;border-radius:15px;background:var(--acc);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin.empty span{background:#6b7280}
.pin.sel span{background:var(--acc2);transform:translate(-50%,-50%) scale(1.2)}
.pin.dim{opacity:.25}
.pin svg{position:absolute;left:-40px;top:-40px;width:80px;height:80px;overflow:visible}
.pin svg path{fill:rgba(220,38,38,.35);stroke:rgba(220,38,38,.9);stroke-width:1.5}
.pvbar{position:absolute;left:0;right:0;bottom:0;padding:10px calc(var(--sar) + 10px) calc(var(--sab) + 10px) calc(var(--sal) + 10px);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;pointer-events:none}
.pvbar>*{pointer-events:auto;box-shadow:0 2px 8px rgba(0,0,0,.2)}
@media(max-width:600px){#zin,#zout{display:none}}
.hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--acc2);color:#fff;padding:8px 14px;border-radius:999px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.25);white-space:nowrap}
/* Modal / Sheet */
.ov{position:fixed;inset:0;background:rgba(17,24,39,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:94%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:760px){.ov{align-items:center}.sheet{border-radius:16px;max-height:90%}}
.sheet .hd{display:flex;align-items:center;gap:8px;padding:12px 14px;background:#fff;border-bottom:1px solid var(--line)}
.sheet .hd h2{font-size:17px;margin:0;flex:1}
.sheet .bd{overflow:auto;padding:4px 14px 14px;-webkit-overflow-scrolling:touch}
.sheet .ft{display:flex;gap:8px;padding:10px 14px calc(var(--sab) + 10px);background:#fff;border-top:1px solid var(--line);flex-wrap:wrap}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:8px;background:#e5e7eb center/cover no-repeat;cursor:pointer;overflow:hidden}
.thumb .d{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 4px;text-align:center}
.thumb .c{position:absolute;top:4px;right:4px;width:10px;height:10px;border-radius:5px;background:#facc15;border:1px solid #fff}
.photoBig{width:100%;max-height:52vh;object-fit:contain;background:#111;border-radius:10px;display:block}
.dialwrap{display:flex;align-items:center;gap:14px}
.dial{width:130px;height:130px;touch-action:none;cursor:pointer;flex:none}
.dial .bg{fill:#fff;stroke:#d1d5db;stroke-width:2}
.dial path{fill:rgba(220,38,38,.35);stroke:#dc2626;stroke-width:2}
.dial text{font-size:11px;fill:#6b7280;text-anchor:middle;dominant-baseline:middle}
/* Fotoliste */
.day{margin:16px 0 6px;font-weight:700;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ph{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;cursor:pointer}
.ph .im{width:78px;height:78px;border-radius:8px;background:#e5e7eb center/cover;flex:none}
.ph .tx{flex:1;min-width:0}
.ph .tx .a{font-weight:600}
.ph .tx .b{font-size:13px;color:var(--muted)}
.ph .tx .c{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .ck{width:30px;height:30px;border-radius:8px;border:2px solid #d1d5db;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.ph.on .ck{background:var(--acc2);border-color:var(--acc2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.busy{position:fixed;inset:0;background:rgba(17,24,39,.6);z-index:100;display:flex;align-items:center;justify-content:center}
.busy .card{min-width:260px;text-align:center}
.bar{height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--acc2);width:0}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 80px);transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 16px;border-radius:10px;z-index:200;font-size:15px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.sect{margin-top:18px}.sect h3{font-size:15px;margin:0 0 6px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
</style>
</head>
<body>
<header><button id="back" hidden>‹ Zurück</button><h1 id="title">PlanDoku</h1><button id="syncBtn" hidden></button><div id="acts" class="row"></div></header>
<main id="view"></main>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileLib" accept="image/*" multiple hidden>
<script src="lib/pdf.min.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/jszip.min.js"></script>
<script src="lib/msal-browser.min.js"></script>
<script>
'use strict';
/* =========================================================
   PlanDoku – Fotodokumentation auf Plänen · Studio F ZT GmbH
   Lokale Datenhaltung (IndexedDB), Austausch per Projekt-ZIP
   ========================================================= */
const APP_VERSION = '1.1.0';
// OneDrive-Synchronisierung: IDs aus der Entra-App-Registrierung (alternativ in den Einstellungen je Gerät eintragen)
const DEFAULT_CLIENT_ID = '';
const DEFAULT_TENANT_ID = '';
const CATS = ['Bestand', 'Rückbau', 'Rohbau', 'Ausbau', 'Mangel', 'Abnahme', 'Sonstiges'];
const PLAN_MAXDIM = 5000, PLAN_MAXAREA = 16e6;   // iOS-Canvas-Limit beachten
const PHOTO_MAX = 2400, THUMB_MAX = 360;
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2));
const now = () => Date.now();
const pad = n => String(n).padStart(2, '0');
const localISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmtDate = iso => iso ? `${iso.slice(8, 10)}.${iso.slice(5, 7)}.${iso.slice(0, 4)}` : '';
const fmtDT = iso => iso ? `${fmtDate(iso)} ${iso.slice(11, 16)}` : '';
const sleep = ms => new Promise(r => setTimeout(r, ms));
const settings = {
  get author() { return localStorage.getItem('pd_author') || ''; },
  set author(v) { localStorage.setItem('pd_author', v); },
  get lastCat() { return localStorage.getItem('pd_cat') || 'Bestand'; },
  set lastCat(v) { localStorage.setItem('pd_cat', v); },
};

/* ---------------- Datenbank ---------------- */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('plandoku', 2);
      r.onupgradeneeded = () => {
        const d = r.result, has = n => d.objectStoreNames.contains(n);
        if (!has('projects')) d.createObjectStore('projects', { keyPath: 'id' });
        for (const s of ['plans', 'points', 'photos']) if (!has(s)) d.createObjectStore(s, { keyPath: 'id' }).createIndex('projectId', 'projectId');
        if (!has('blobs')) d.createObjectStore('blobs', { keyPath: 'id' });
        if (!has('meta')) d.createObjectStore('meta', { keyPath: 'id' });   // Sync-Status
      };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  st(s, m = 'readonly') { return this.db.transaction(s, m).objectStore(s); },
  rq(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  get(s, id) { return this.rq(this.st(s).get(id)); },
  put(s, o) { return this.rq(this.st(s, 'readwrite').put(o)); },
  del(s, id) { return this.rq(this.st(s, 'readwrite').delete(id)); },
  all(s) { return this.rq(this.st(s).getAll()); },
  async byProject(s, pid, withDeleted = false) {
    const r = await this.rq(this.st(s).index('projectId').getAll(pid));
    return withDeleted ? r : r.filter(x => !x.deleted);
  },
  // Blobs als ArrayBuffer speichern (robust in iOS Safari)
  async putBlob(blob, id = uid()) { await this.put('blobs', { id, type: blob.type, data: await blob.arrayBuffer() }); return id; },
  async getBlob(id) { const r = id && await this.get('blobs', id); return r ? new Blob([r.data], { type: r.type }) : null; },
};
async function save(store, obj) { obj.updated = now(); await DB.put(store, obj); Sync.schedule(); return obj; }
async function softDelete(store, obj) { obj.deleted = true; obj.updated = now(); await DB.put(store, obj); Sync.schedule(); }
const metaGet = async id => { const r = await DB.get('meta', id); return r ? r.v : undefined; };
const metaSet = (id, v) => DB.put('meta', { id, v });
// Datensatz zusammenführen: der neuere Stand gewinnt
async function mergeRecord(store, rec) {
  const ex = await DB.get(store, rec.id);
  if (ex && (rec.updated || 0) <= (ex.updated || 0)) return false;
  if (rec.deleted && ex) for (const k of ['blobId', 'thumbId']) if (ex[k]) await DB.del('blobs', ex[k]);
  await DB.put(store, rec); return true;
}
async function purgeProjectLocal(pid) {
  for (const s of ['plans', 'photos']) for (const r of await DB.byProject(s, pid, true)) { if (r.blobId) await DB.del('blobs', r.blobId); if (r.thumbId) await DB.del('blobs', r.thumbId); await DB.del(s, r.id); }
  for (const r of await DB.byProject('points', pid, true)) await DB.del('points', r.id);
}

const urlCache = new Map();
async function blobURL(id) {
  if (!id) return '';
  if (urlCache.has(id)) return urlCache.get(id);
  const b = await DB.getBlob(id); if (!b) return '';
  const u = URL.createObjectURL(b); urlCache.set(id, u); return u;
}

/* ---------------- UI-Grundlagen ---------------- */
const view = $('#view');
const S = { project: null, tab: 'plans', selection: new Set(), filter: null };
function setBar(title, back, acts = []) {
  $('#title').textContent = title;
  const b = $('#back'); b.hidden = !back; b.onclick = back || null;
  const a = $('#acts'); a.innerHTML = '';
  for (const x of acts) { const btn = document.createElement('button'); btn.textContent = x.label; btn.onclick = x.fn; a.appendChild(btn); }
}
function toast(msg, ms = 2200) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}
const busy = {
  el: null,
  show(msg) { this.hide(); this.el = document.createElement('div'); this.el.className = 'busy'; this.el.innerHTML = `<div class="card"><div id="busyMsg">${esc(msg)}</div><div class="bar"><i id="busyBar"></i></div></div>`; document.body.appendChild(this.el); },
  set(msg, frac) { if (!this.el) return; $('#busyMsg').textContent = msg; if (frac != null) $('#busyBar').style.width = Math.round(frac * 100) + '%'; },
  hide() { if (this.el) this.el.remove(); this.el = null; }
};
const modals = [];
function openSheet(title, bodyHTML, footHTML = '', onClose) {
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="sheet"><div class="hd"><h2>${esc(title)}</h2><button class="btn sm ghost" data-x>✕</button></div><div class="bd">${bodyHTML}</div>${footHTML ? `<div class="ft">${footHTML}</div>` : ''}</div>`;
  document.body.appendChild(ov);
  const m = { el: ov, onClose, close() { ov.remove(); const i = modals.indexOf(m); if (i >= 0) modals.splice(i, 1); if (m.onClose) m.onClose(); } };
  modals.push(m);
  $('[data-x]', ov).onclick = () => m.close();
  ov.addEventListener('click', e => { if (e.target === ov) m.close(); });
  return m;
}
function confirmBox(text, okLabel = 'Löschen') {
  return new Promise(res => {
    const m = openSheet('Bestätigen', `<p>${esc(text)}</p>`, `<button class="btn grow" data-no>Abbrechen</button><button class="btn red grow" data-ok>${esc(okLabel)}</button>`, () => res(false));
    $('[data-no]', m.el).onclick = () => m.close();
    $('[data-ok]', m.el).onclick = () => { m.onClose = null; m.close(); res(true); };
  });
}
function promptBox(title, fields) {
  // fields: [{key,label,value,type?,options?}]
  return new Promise(res => {
    const body = fields.map(f => `<label class="f">${esc(f.label)}</label>` + (f.options
      ? `<select data-k="${f.key}">${f.options.map(o => `<option ${o === f.value ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`
      : `<input type="${f.type || 'text'}" data-k="${f.key}" value="${esc(f.value || '')}">`)).join('');
    const m = openSheet(title, body, `<button class="btn grow" data-no>Abbrechen</button><button class="btn primary grow" data-ok>OK</button>`, () => res(null));
    $('[data-no]', m.el).onclick = () => m.close();
    $('[data-ok]', m.el).onclick = () => { const r = {}; $$('[data-k]', m.el).forEach(i => r[i.dataset.k] = i.value.trim()); m.onClose = null; m.close(); res(r); };
    setTimeout(() => { const i = $('input', m.el); if (i) i.focus(); }, 50);
  });
}
function pickFiles(input) {
  return new Promise(res => {
    input.value = '';
    input.onchange = () => res([...input.files]);
    input.click();
  });
}
async function saveFile(blob, name) {
  const file = new File([blob], name, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 60000);
}
function safeName(s) { return String(s || 'Projekt').replace(/[^\wäöüÄÖÜß\- ]+/g, '').trim().replace(/\s+/g, '_').slice(0, 60); }

/* ---------------- Bildverarbeitung ---------------- */
function loadImg(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Bild konnte nicht geladen werden')); i.src = src; });
}
function canvasBlob(c, type = 'image/jpeg', q = 0.86) { return new Promise(r => c.toBlob(r, type, q)); }
function fitSize(w, h, maxDim, maxArea = Infinity) {
  const s = Math.min(1, maxDim / Math.max(w, h), Math.sqrt(maxArea / (w * h)));
  return [Math.max(1, Math.round(w * s)), Math.max(1, Math.round(h * s))];
}
async function scaleToBlob(img, maxDim, q = 0.86, maxArea) {
  const [w, h] = fitSize(img.naturalWidth || img.width, img.naturalHeight || img.height, maxDim, maxArea);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
  const b = await canvasBlob(c, 'image/jpeg', q); c.width = c.height = 0;
  return { blob: b, w, h };
}
// EXIF-Aufnahmedatum (JPEG) lesen
async function exifDate(file) {
  try {
    const v = new DataView(await file.slice(0, 256 * 1024).arrayBuffer());
    if (v.getUint16(0) !== 0xFFD8) return null;
    let o = 2;
    while (o < v.byteLength - 4) {
      const m = v.getUint16(o);
      if (m === 0xFFE1 && v.getUint32(o + 4) === 0x45786966) return parseTiffDate(v, o + 10);
      if ((m & 0xFF00) !== 0xFF00) break;
      o += 2 + v.getUint16(o + 2);
    }
  } catch (e) { }
  return null;
}
function parseTiffDate(v, t) {
  const le = v.getUint16(t) === 0x4949;
  const g16 = p => v.getUint16(p, le), g32 = p => v.getUint32(p, le);
  const str = e => { const n = g32(e + 4), off = n > 4 ? t + g32(e + 8) : e + 8; let s = ''; for (let i = 0; i < n - 1; i++) s += String.fromCharCode(v.getUint8(off + i)); return s; };
  const ifd = (p, cb) => { const n = g16(p); for (let i = 0; i < n; i++) { const e = p + 2 + i * 12; cb(g16(e), e); } };
  let dt = null, dto = null, ex = null;
  ifd(t + g32(t + 4), (tag, e) => { if (tag === 0x0132) dt = str(e); if (tag === 0x8769) ex = t + g32(e + 8); });
  if (ex) ifd(ex, (tag, e) => { if (tag === 0x9003) dto = str(e); });
  const m = (dto || dt || '').match(/(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2})/);
  return m ? `${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}` : null;
}
async function processPhoto(file) {
  const date = (await exifDate(file)) || localISO(new Date(file.lastModified || Date.now()));
  const u = URL.createObjectURL(file);
  try {
    const img = await loadImg(u);
    const full = await scaleToBlob(img, PHOTO_MAX, 0.85);
    const th = await scaleToBlob(img, THUMB_MAX, 0.75);
    return { date, full, th };
  } finally { URL.revokeObjectURL(u); }
}

/* ---------------- Pläne importieren ---------------- */
async function importPlans(files, project) {
  const existing = await DB.byProject('plans', project.id);
  let order = existing.reduce((m, p) => Math.max(m, p.order || 0), 0);
  busy.show('Plan wird aufbereitet …');
  try {
    for (const file of files) {
      const base = file.name.replace(/\.[^.]+$/, '');
      if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
        const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
        for (let p = 1; p <= pdf.numPages; p++) {
          busy.set(`${file.name}: Seite ${p}/${pdf.numPages}`, p / pdf.numPages);
          const page = await pdf.getPage(p);
          const v1 = page.getViewport({ scale: 1 });
          const [w] = fitSize(v1.width, v1.height, PLAN_MAXDIM, PLAN_MAXAREA);
          const vp = page.getViewport({ scale: w / v1.width });
          const c = document.createElement('canvas'); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
          const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
          await page.render({ canvasContext: x, viewport: vp }).promise;
          const blob = await canvasBlob(c, 'image/jpeg', 0.9);
          const thumb = await scaleToBlob(c, 600, 0.8);
          await addPlan(project, pdf.numPages > 1 ? `${base} – S.${p}` : base, blob, thumb.blob, c.width, c.height, ++order);
          c.width = c.height = 0; page.cleanup();
        }
        pdf.destroy();
      } else {
        busy.set(file.name, 0.5);
        const u = URL.createObjectURL(file);
        const img = await loadImg(u); URL.revokeObjectURL(u);
        const full = await scaleToBlob(img, PLAN_MAXDIM, 0.9, PLAN_MAXAREA);
        const thumb = await scaleToBlob(img, 600, 0.8);
        await addPlan(project, base, full.blob, thumb.blob, full.w, full.h, ++order);
      }
    }
  } catch (e) { alert('Fehler beim Import: ' + e.message); }
  busy.hide();
}
async function addPlan(project, name, blob, thumb, w, h, order) {
  const plan = { id: uid(), projectId: project.id, name, floor: '', order, w, h, created: now() };
  plan.blobId = await DB.putBlob(blob); plan.thumbId = await DB.putBlob(thumb);
  await save('plans', plan); await touchProject(project);
}

    <div class="pvbar"><button class="btn red" id="addPt">＋ Fotopunkt setzen</button><button class="btn" id="fit">⤢ Einpassen</button><button class="btn" id="zin">＋</button><button class="btn" id="zout">－</button></div></div>`;

  $('#zout').onclick = () => zoomAt(pv.clientWidth / 2, pv.clientHeight / 2, 1 / 1.5);
  bindGestures(pv);
  window.onresize = () => { if ($('#pv')) applyPV(); };
}
async function reloadPV() {
  const pid = S.project.id;
  PV.points = (await DB.byProject('points', pid)).filter(x => x.planId === PV.plan.id);
  PV.photos = (await DB.byProject('photos', pid)).filter(f => PV.points.some(x => x.id === f.pointId));
  renderPins();
}
function setMode(mode, moving = null) {
  PV.mode = mode; PV.moving = moving;
  const h = $('#pvHint'); if (!h) return;
  h.innerHTML = mode === 'add' ? '<div class="hint">Tippe auf die Aufnahmeposition im Plan</div>' : mode === 'move' ? '<div class="hint">Tippe auf die neue Position</div>' : '';
  const b = $('#addPt'); if (b) b.textContent = mode === 'add' ? '✕ Abbrechen' : '＋ Fotopunkt setzen';
}
function fitPV() {
  const pv = $('#pv'); if (!pv) return;
  const cw = pv.clientWidth, ch = pv.clientHeight - 70;
  PV.s = Math.min(cw / PV.plan.w, ch / PV.plan.h) * 0.96;
  PV.tx = (cw - PV.plan.w * PV.s) / 2; PV.ty = (ch - PV.plan.h * PV.s) / 2 + 4;
  applyPV();
}
function centerOn(p) {
  const pv = $('#pv'); PV.s = Math.max(PV.s, Math.min(pv.clientWidth / PV.plan.w, pv.clientHeight / PV.plan.h) * 3);
  PV.tx = pv.clientWidth / 2 - p.x * PV.plan.w * PV.s; PV.ty = pv.clientHeight / 2 - p.y * PV.plan.h * PV.s; applyPV();
}
function clampScale(s) {
  const pv = $('#pv'); const fit = Math.min(pv.clientWidth / PV.plan.w, pv.clientHeight / PV.plan.h);
  return Math.max(fit * 0.5, Math.min(s, 3));
}
function zoomAt(cx, cy, f) {
  const ns = clampScale(PV.s * f); const ix = (cx - PV.tx) / PV.s, iy = (cy - PV.ty) / PV.s;
  PV.s = ns; PV.tx = cx - ix * ns; PV.ty = cy - iy * ns; applyPV();
}
function applyPV() {
  const el = $('#pvIn'); if (!el) return;
  el.style.transform = `translate(${PV.tx}px,${PV.ty}px) scale(${PV.s})`;
  positionPins();
}
function renderPins() {
  const box = $('#pins'); if (!box) return;
  box.innerHTML = PV.points.map(p => {
    const n = PV.photos.filter(f => f.pointId === p.id).length;
    return `<div class="pin ${n ? '' : 'empty'} ${PV.sel === p.id ? 'sel' : ''}" data-id="${p.id}">${p.dir != null ? `<svg viewBox="-40 -40 80 80" style="transform:rotate(${p.dir}deg)"><path d="M0 0 L-15 -36 A39 39 0 0 1 15 -36 Z"/></svg>` : ''}<span>${p.nr}</span></div>`;
  }).join('');
  positionPins();
}
function positionPins() {
  for (const el of $$('.pin')) {
    const p = PV.points.find(x => x.id === el.dataset.id); if (!p) continue;
    el.style.left = (PV.tx + p.x * PV.plan.w * PV.s) + 'px'; el.style.top = (PV.ty + p.y * PV.plan.h * PV.s) + 'px';
  }
}
function bindGestures(pv) {
  const pts = new Map(); let start = null, pinch = null;
  const rel = e => { const r = pv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  pv.addEventListener('pointerdown', e => {
    if (e.target.closest('.pvbar')) return;
    pv.setPointerCapture(e.pointerId); pts.set(e.pointerId, rel(e));
    if (pts.size === 1) { const q = rel(e); start = { ...q, t: Date.now(), tx: PV.tx, ty: PV.ty, moved: false }; pinch = null; }
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s: PV.s, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, tx: PV.tx, ty: PV.ty };
      if (start) start.moved = true;
    }
  });
  pv.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, rel(e));
    if (pts.size === 1 && start) {
      const q = rel(e), dx = q.x - start.x, dy = q.y - start.y;
      if (Math.hypot(dx, dy) > 8) start.moved = true;
      if (start.moved) { PV.tx = start.tx + dx; PV.ty = start.ty + dy; applyPV(); }
    } else if (pts.size >= 2 && pinch) {
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const ns = clampScale(pinch.s * d / pinch.d);
      const ix = (pinch.mx - pinch.tx) / pinch.s, iy = (pinch.my - pinch.ty) / pinch.s;
      PV.s = ns; PV.tx = mx - ix * ns; PV.ty = my - iy * ns; applyPV();
    }
  });
  const end = e => {
    if (!pts.has(e.pointerId)) return;
    const q = rel(e); pts.delete(e.pointerId);
    if (pts.size === 0) {
      if (start && !start.moved && Date.now() - start.t < 600) onPlanTap(q.x, q.y);
      start = null; pinch = null;
    } else if (pts.size === 1) {
      const r = [...pts.values()][0]; start = { ...r, t: 0, tx: PV.tx, ty: PV.ty, moved: true }; pinch = null;
    }
  };
  pv.addEventListener('pointerup', end); pv.addEventListener('pointercancel', end);
  pv.addEventListener('wheel', e => { e.preventDefault(); const q = rel(e); zoomAt(q.x, q.y, e.deltaY < 0 ? 1.15 : 1 / 1.15); }, { passive: false });
}
async function onPlanTap(x, y) {
  const ix = (x - PV.tx) / PV.s / PV.plan.w, iy = (y - PV.ty) / PV.s / PV.plan.h;
  const inside = ix >= 0 && ix <= 1 && iy >= 0 && iy <= 1;
  if (PV.mode === 'add') {
    if (!inside) return toast('Bitte innerhalb des Plans tippen');
    setMode(null);
    const all = await DB.byProject('points', S.project.id, true);
    const nr = all.reduce((m, p) => Math.max(m, p.nr || 0), 0) + 1;
    const last = PV.points.slice().sort((a, b) => b.created - a.created)[0];
    const p = await save('points', { id: uid(), projectId: S.project.id, planId: PV.plan.id, x: ix, y: iy, nr, room: last ? last.room : '', dir: null, created: now() });
    await touchProject(S.project);
    PV.sel = p.id; await reloadPV(); openPoint(p.id);
    return;
  }
  if (PV.mode === 'move') {
    if (!inside) return toast('Bitte innerhalb des Plans tippen');
    const p = await DB.get('points', PV.moving); p.x = ix; p.y = iy; await save('points', p);
    setMode(null); await reloadPV(); toast('Position geändert'); return;
  }
  // Pin treffen
  let best = null, bd = 26;
  for (const p of PV.points) {
    const d = Math.hypot(PV.tx + p.x * PV.plan.w * PV.s - x, PV.ty + p.y * PV.plan.h * PV.s - y);
    if (d < bd) { bd = d; best = p; }
  }
  if (best) { PV.sel = best.id; renderPins(); openPoint(best.id); }
}

async function addPhotos(files, point) {

function applyFilter(data, f) {
  const q = (f.q || '').toLowerCase();
  return data.photos.filter(ph => {
    const pt = data.pointMap.get(ph.pointId);
    if (f.plans && f.plans.size && !f.plans.has(pt.planId)) return false;
    if (f.rooms && f.rooms.size && !f.rooms.has(pt.room || '(ohne Raum)')) return false;
    if (f.cats && f.cats.size && !f.cats.has(ph.category)) return false;
    if (f.from && ph.date.slice(0, 10) < f.from) return false;
    if (f.to && ph.date.slice(0, 10) > f.to) return false;
    if (q && !((ph.comment || '') + ' ' + (pt.room || '')).toLowerCase().includes(q)) return false;
    return true;
  });
}
function ensureFilter() {
  if (!S.filter || !S.filter.plans) {
    const plan = S.filter && S.filter.plan;
    S.filter = { plans: new Set(plan ? [plan] : []), rooms: new Set(), cats: new Set(), from: '', to: '', q: '' };
  }
  return S.filter;
}

function describeFilter(data, f) {
  const parts = [];
  if (f.from || f.to) parts.push(`Zeitraum ${f.from ? fmtDate(f.from) : '…'} – ${f.to ? fmtDate(f.to) : '…'}`);
  if (f.plans.size) parts.push('Pläne: ' + [...f.plans].map(id => data.planMap.get(id)?.name).filter(Boolean).join(', '));
  if (f.rooms.size) parts.push('Räume: ' + [...f.rooms].join(', '));
  if (f.cats.size) parts.push('Kategorien: ' + [...f.cats].join(', '));
  if (f.q) parts.push(`Suchbegriff „${f.q}“`);
  return parts.length ? parts.join(' · ') : 'Alle Fotos';
}

/* ---------------- PDF-Erstellung ---------------- */
function drawMarker(ctx, x, y, r, nr, dir) {
  if (dir != null) {
    const a = (dir - 90) * Math.PI / 180, w = 0.45;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, r * 3.4, a - w, a + w); ctx.closePath();
    ctx.fillStyle = 'rgba(220,38,38,0.33)'; ctx.fill(); ctx.lineWidth = Math.max(1, r * 0.12); ctx.strokeStyle = 'rgba(220,38,38,0.9)'; ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = '#dc2626'; ctx.fill();
  ctx.lineWidth = Math.max(1, r * 0.18); ctx.strokeStyle = '#fff'; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.round(r * (String(nr).length > 2 ? 0.85 : 1.1))}px Helvetica, Arial, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(nr), x, y + r * 0.05);
}
async function buildReport(project, data, list, opt, desc) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
  const photoMax = opt.quality === 'hi' ? 2400 : 1500, photoQ = opt.quality === 'hi' ? 0.88 : 0.8;
  const pt = id => data.pointMap.get(id), pl = id => data.planMap.get(id);
  const planIdx = new Map(data.plans.map((p, i) => [p.id, i]));
  const items = list.slice().sort((a, b) => planIdx.get(pt(a.pointId).planId) - planIdx.get(pt(b.pointId).planId) || pt(a.pointId).nr - pt(b.pointId).nr || a.date.localeCompare(b.date));
  // stabile Fotonummer je Punkt (über alle Fotos des Punktes)
  const label = new Map();
  for (const p of data.points) data.photos.filter(f => f.pointId === p.id).sort((a, b) => a.date.localeCompare(b.date)).forEach((f, i, arr) => label.set(f.id, arr.length > 1 ? `${p.nr}.${i + 1}` : String(p.nr)));
  const created = fmtDT(localISO(new Date()));
  const author = settings.author;
  const header = () => {
    const W = doc.internal.pageSize.getWidth();
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(110);
    doc.text(project.name + (project.number ? ' · ' + project.number : ''), 15, 10);
    doc.text(opt.title, W - 15, 10, { align: 'right' });
    doc.setDrawColor(200); doc.setLineWidth(0.2); doc.line(15, 12, W - 15, 12); doc.setTextColor(0);
  };
  // Deckblatt
  const dates = items.map(i => i.date).sort();
  doc.setFont('helvetica', 'bold'); doc.setFontSize(24); doc.text(opt.title, 15, 45);
  doc.setFontSize(15); doc.text(doc.splitTextToSize(project.name, 180), 15, 57);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5);
  const rows = [['Projektnummer', project.number], ['Adresse', project.address], ['Auftraggeber / Bauherr', project.client],
    ['Aufnahmezeitraum', dates.length ? `${fmtDate(dates[0])} – ${fmtDate(dates[dates.length - 1])}` : ''],
    ['Umfang', `${items.length} Fotos an ${new Set(items.map(i => i.pointId)).size} Aufnahmepunkten`], ['Auswahl', desc],
    ['Erstellt', created + (author ? ' · ' + author : '')]].filter(r => r[1]);
  let y = 75;
  for (const [k, v] of rows) { doc.setTextColor(110); doc.text(k, 15, y); doc.setTextColor(0); const ln = doc.splitTextToSize(String(v), 125); doc.text(ln, 70, y); y += 6.5 * ln.length; }
  doc.setFontSize(9); doc.setTextColor(110);
  doc.text(doc.splitTextToSize('Die Aufnahmeposition jedes Fotos ist im zugehörigen Planausschnitt mit Punktnummer und Blickrichtung (Sektor) markiert. Punkte mit mehreren Aufnahmen sind fortlaufend nummeriert (z. B. 12.1, 12.2).', 180), 15, y + 8);
  doc.setTextColor(0);
  // Plan-Bilder laden
  const planImgs = new Map();
  const usedPlans = data.plans.filter(p => items.some(i => pt(i.pointId).planId === p.id));
  for (const p of usedPlans) planImgs.set(p.id, await loadImg(await blobURL(p.blobId)));
  // Übersichtspläne
  if (opt.overview) {
    for (const p of usedPlans) {
      busy.set(`Übersichtsplan ${p.name}`, 0.02);
      const land = p.w > p.h; doc.addPage('a4', land ? 'landscape' : 'portrait'); header();
      const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
      const [cw, ch] = fitSize(p.w, p.h, 3200, 9e6);
      const c = document.createElement('canvas'); c.width = cw; c.height = ch; const x = c.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0, 0, cw, ch); x.drawImage(planImgs.get(p.id), 0, 0, cw, ch);
      const r = Math.max(cw, ch) / 115;
      const ptsOn = [...new Set(items.map(i => i.pointId))].map(pt).filter(q => q.planId === p.id);
      for (const q of ptsOn) drawMarker(x, q.x * cw, q.y * ch, r, q.nr, q.dir);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.text(`Übersicht: ${p.name}${p.floor ? ' · ' + p.floor : ''}`, 15, 20);
      const bw = W - 30, bh = H - 34; const k = Math.min(bw / cw, bh / ch);
      doc.addImage(c.toDataURL('image/jpeg', 0.85), 'JPEG', 15 + (bw - cw * k) / 2, 25, cw * k, ch * k);
      c.width = c.height = 0;
    }
  }
  // Einzelaufnahmen
  const crop = (p, q, px = 700) => {
    const img = planImgs.get(p.id), side = Math.max(p.w, p.h) * 0.3;
    const sx = q.x * p.w - side / 2, sy = q.y * p.h - side / 2, k = px / side;
    const c = document.createElement('canvas'); c.width = c.height = px; const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, px, px);
    const x0 = Math.max(0, sx), y0 = Math.max(0, sy), x1 = Math.min(p.w, sx + side), y1 = Math.min(p.h, sy + side);
    if (x1 > x0 && y1 > y0) x.drawImage(img, x0, y0, x1 - x0, y1 - y0, (x0 - sx) * k, (y0 - sy) * k, (x1 - x0) * k, (y1 - y0) * k);
    drawMarker(x, px / 2, px / 2, px / 26, q.nr, q.dir);
    const u = c.toDataURL('image/jpeg', 0.85); c.width = c.height = 0; return u;
  };
  const photoData = async f => {
    const u = URL.createObjectURL(await DB.getBlob(f.blobId));
    try { const img = await loadImg(u); const [w, h] = fitSize(img.naturalWidth, img.naturalHeight, photoMax);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
      const d = c.toDataURL('image/jpeg', photoQ); c.width = c.height = 0; return { d, w, h };
    } finally { URL.revokeObjectURL(u); }
  };
  const fitBox = (doc, d, iw, ih, x, y, bw, bh) => { const k = Math.min(bw / iw, bh / ih); doc.addImage(d, 'JPEG', x + (bw - iw * k) / 2, y + (bh - ih * k) / 2, iw * k, ih * k); };
  const metaLines = (f, q, p) => [`Plan: ${p.name}${p.floor ? ' · ' + p.floor : ''}`, `Kategorie: ${f.category || '–'}`, `Aufnahme: ${fmtDT(f.date)}`, f.author ? `Von: ${f.author}` : null, q.dir != null ? `Blickrichtung: ${q.dir}°` : null].filter(Boolean);
  const per = opt.layout === '1' ? 1 : 2;
  let slot = per;
  for (let i = 0; i < items.length; i++) {
    busy.set(`Foto ${i + 1}/${items.length}`, (i + 1) / items.length);
    await sleep(0);
    const f = items[i], q = pt(f.pointId), p = pl(q.planId);
    const ph = await photoData(f), cr = crop(p, q);
    const title = `Foto ${label.get(f.id)}${q.room ? '  ·  ' + q.room : ''}`;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
    const cm = f.comment ? doc.splitTextToSize(f.comment, per === 1 ? 108 : 180) : [];
    let usePer = per;
    if (per === 2 && cm.length > 6) usePer = 1;                // lange Anmerkung → eigene Seite
    if (usePer === 1 || slot >= per) { doc.addPage('a4', 'portrait'); header(); slot = 0; }
    const y0 = 18 + slot * 136;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.text(title, 15, y0 + 4);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(90); doc.text(fmtDT(f.date), 195, y0 + 4, { align: 'right' }); doc.setTextColor(0);
    if (usePer === 1) {
      doc.setFillColor(245); doc.rect(15, y0 + 8, 180, 140, 'F');
      fitBox(doc, ph.d, ph.w, ph.h, 15, y0 + 8, 180, 140);
      doc.addImage(cr, 'JPEG', 15, y0 + 154, 70, 70); doc.setDrawColor(170); doc.rect(15, y0 + 154, 70, 70);
      doc.setFontSize(8.5); doc.setTextColor(90); doc.text(metaLines(f, q, p), 90, y0 + 158); doc.setTextColor(0);
      if (cm.length) { doc.setFontSize(9.5); doc.setFont('helvetica', 'bold'); doc.text('Anmerkung', 90, y0 + 184); doc.setFont('helvetica', 'normal'); doc.text(cm.slice(0, 19), 90, y0 + 189); }
      slot = per; // Seite voll
    } else {
      doc.setFillColor(245); doc.rect(15, y0 + 8, 118, 88.5, 'F');
      fitBox(doc, ph.d, ph.w, ph.h, 15, y0 + 8, 118, 88.5);
      doc.addImage(cr, 'JPEG', 137, y0 + 8, 58, 58); doc.setDrawColor(170); doc.rect(137, y0 + 8, 58, 58);
      doc.setFontSize(8); doc.setTextColor(90);
      doc.text(metaLines(f, q, p).flatMap(l => doc.splitTextToSize(l, 58)).slice(0, 7), 137, y0 + 71); doc.setTextColor(0);
      if (cm.length) { doc.setFontSize(9.5); doc.text(cm, 15, y0 + 102); }
      if (slot === 0) { doc.setDrawColor(210); doc.line(15, y0 + 131, 195, y0 + 131); }
      slot++;

  }

  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i); const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(110);
    doc.text('Studio F ZT GmbH · ' + created, 15, H - 8); doc.text(`Seite ${i} / ${n}`, W - 15, H - 8, { align: 'right' }); doc.setTextColor(0);
  }
  return doc.output('blob');
}

async function exportProjectZip(p) {

    const zip = new JSZip();

    zip.file('data.json', JSON.stringify({ format: 'plandoku', version: 1, exported: now(), project: p, plans, points, photos }));
    const ids = [...plans, ...photos].filter(r => !r.deleted).flatMap(r => [r.blobId, r.thumbId]).filter(Boolean);

    const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' }, m => busy.set('ZIP wird geschrieben …', 0.5 + m.percent / 200));

    const m = openSheet('Export fertig', `<p>${esc(name)}</p><p class="muted small">${(blob.size / 1048576).toFixed(1)} MB – z. B. in OneDrive oder Google Drive sichern.</p>`, `<span class="grow"></span><button class="btn primary" id="sh">Teilen / Sichern</button>`);

async function importProjectZip(file) {
  busy.show('Import …');
  try {
    const zip = await JSZip.loadAsync(file);
    const j = JSON.parse(await zip.file('data.json').async('string'));
    if (j.format !== 'plandoku') throw new Error('Keine PlanDoku-Projektdatei');
    let added = 0, updated = 0;
    const merge = async (store, rec) => {
      const isNew = !(await DB.get(store, rec.id));
      const ch = await mergeRecord(store, rec);
      if (ch) isNew ? added++ : updated++;
      return ch;
    };
    const recs = [...j.plans.map(r => ['plans', r]), ...j.points.map(r => ['points', r]), ...j.photos.map(r => ['photos', r])];
    let i = 0;
    for (const [store, rec] of recs) {
      busy.set('Daten zusammenführen …', ++i / recs.length);
      const changed = await merge(store, rec);
      if (changed && !rec.deleted) for (const k of ['blobId', 'thumbId']) {
        if (!rec[k] || await DB.get('blobs', rec[k])) continue;
        const zf = zip.file(`blobs/${rec[k]}`); if (!zf) continue;
        const data = await zf.async('arraybuffer');
        await DB.put('blobs', { id: rec[k], type: 'image/jpeg', data });
      }
    }
    const exP = await DB.get('projects', j.project.id);
    if (!exP || (j.project.updated || 0) > (exP.updated || 0)) await DB.put('projects', j.project);
    else { exP.updated = now(); await DB.put('projects', exP); }
    busy.hide(); Sync.schedule(); toast(`Import: ${added} neu, ${updated} aktualisiert`, 3500);
  } catch (e) { busy.hide(); alert('Import fehlgeschlagen: ' + e.message); }
}

/* ---------------- Synchronisierung über OneDrive (Microsoft Graph) ----------------
   Ablage in OneDrive: /Apps/PlanDoku/projekt_<id>.json  (alle Datensätze inkl. Löschungen)
                       /Apps/PlanDoku/blobs/<id>.jpg     (Pläne, Fotos, Vorschaubilder – unveränderlich)
   Ablauf je Projekt: entfernten Stand laden → zusammenführen (neuerer Stand gewinnt) →
   fehlende Bilder hoch-/herunterladen → zusammengeführten Stand mit If-Match hochladen. */

  redirectUri() { return location.origin + location.pathname.replace(/index\.html$/, ''); },
  async init() {
    const { clientId, tenant } = this.cfg();
    if (!clientId || !window.msal) { this.setStatus('off'); return; }
    try {
      this.msal = new msal.PublicClientApplication({
        auth: { clientId, authority: `https://login.microsoftonline.com/${tenant || 'organizations'}`, redirectUri: this.redirectUri(), navigateToLoginRequestUrl: false },
        cache: { cacheLocation: 'localStorage' }

      if (r && r.account) { this.msal.setActiveAccount(r.account); toast('Angemeldet als ' + r.account.username); }
    } catch (e) { console.warn(e); this.lastErr = e.message; }
    if (!this.msal) { this.setStatus('error'); return; }
    this.account = this.msal.getActiveAccount() || this.msal.getAllAccounts()[0] || null;
    if (!this.account) { this.setStatus('login'); return; }
    this.msal.setActiveAccount(this.account);
    this.setStatus('idle');
    setInterval(() => this.run(), 60000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') this.run(); });
    window.addEventListener('online', () => this.run());
    setTimeout(() => this.run(), 500);
  },
  login() {
    if (!this.msal) return toast('Zuerst Client-ID in den Einstellungen eintragen');
    this.msal.loginRedirect({ scopes: SCOPES, prompt: 'select_account' });
  },
  async logout() {
    if (!this.msal || !this.account) return;
    await this.msal.logoutRedirect({ account: this.account, onRedirectNavigate: () => false });  // nur lokal abmelden
    this.account = null; this.setStatus('login');
  },
  async token() {

    catch (e) {
      if (e instanceof msal.InteractionRequiredAuthError || /interaction_required|login_required|consent_required/.test(e.errorCode || '')) { throw new Error('LOGIN'); }
      throw e;
    }
  },
  schedule(ms = 4000) { if (!this.account) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), ms); },
  async run() {
    if (!this.account) return;
    if (this.running) { this.again = true; return; }
    if (!navigator.onLine) { this.setStatus('offline'); return; }
    this.running = true; this.setStatus('sync');
    let changed = false;
    try { changed = await syncAll(); this.lastOk = Date.now(); this.lastErr = ''; this.setStatus('ok'); }
    catch (e) { console.warn('Sync', e); this.lastErr = e.message; this.setStatus(e.message === 'LOGIN' ? 'login' : navigator.onLine ? 'error' : 'offline'); }
    this.running = false; this.progress = '';
    if (changed) await refreshView();

  },
  setStatus(s) {
    this.status = s;

    b.hidden = s === 'off';
    b.textContent = { login: '☁︎ Anmelden', idle: '☁︎', sync: '☁︎ ⟳' + (this.progress ? ' ' + this.progress : ''), ok: '☁︎ ✓', offline: '☁︎ offline', error: '☁︎ ⚠︎' }[s] || '';
  },
  setProgress(t) { this.progress = t; if (this.status === 'sync') this.setStatus('sync'); }
};
async function refreshView() {
  if (modals.length || busy.el || !S.current) return;
  const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  if (S.project) {
    S.project = await DB.get('projects', S.project.id);
    if (!S.project || S.project.deleted) return showProjects();
  }

}
async function gFetch(method, url, { body, headers = {} } = {}) {
  const t = await Sync.token();
  return fetch(url.startsWith('http') ? url : GRAPH + url, { method, body, headers: { Authorization: 'Bearer ' + t, ...headers } });
}
async function gList(folder) {
  const out = new Map();
  let url = `/root:/${encPath(folder)}:/children?$select=name,eTag,id,size&$top=999`;
  while (url) {
    const r = await gFetch('GET', url);
    if (r.status === 404) return out;
    if (!r.ok) throw new Error('OneDrive ' + r.status);
    const j = await r.json(); j.value.forEach(i => out.set(i.name, i)); url = j['@odata.nextLink'];
  }

}
async function gDownload(path) {
  const r = await gFetch('GET', `/root:/${encPath(path)}`);
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('OneDrive ' + r.status);
  const j = await r.json();
  const d = await fetch(j['@microsoft.graph.downloadUrl']);
  if (!d.ok) throw new Error('Download ' + d.status);

async function gUpload(path, blob, { ifMatch, failIfExists } = {}) {
  const headers = { 'Content-Type': blob.type || 'application/octet-stream' };
  if (ifMatch) headers['If-Match'] = ifMatch;
  if (blob.size < 4 * 1024 * 1024) {
    const r = await gFetch('PUT', `/root:/${encPath(path)}:/content` + (failIfExists ? '?@microsoft.graph.conflictBehavior=fail' : ''), { body: blob, headers });
    if (r.status === 412 || r.status === 409) throw new Error('CONFLICT');
    if (!r.ok) throw new Error('Upload ' + r.status);
    return r.json();
  }
  // große Dateien (Pläne) in Teilen hochladen
  const r = await gFetch('POST', `/root:/${encPath(path)}:/createUploadSession`, {
    body: JSON.stringify({ item: { '@microsoft.graph.conflictBehavior': failIfExists ? 'fail' : 'replace' } }),
    headers: { 'Content-Type': 'application/json', ...(ifMatch ? { 'If-Match': ifMatch } : {}) }
  });
  if (r.status === 412 || r.status === 409) throw new Error('CONFLICT');
  if (!r.ok) throw new Error('Upload ' + r.status);
  const { uploadUrl } = await r.json();
  const CH = 320 * 1024 * 12;
  for (let o = 0; o < blob.size; o += CH) {
    const end = Math.min(o + CH, blob.size);
    const pr = await fetch(uploadUrl, { method: 'PUT', headers: { 'Content-Range': `bytes ${o}-${end - 1}/${blob.size}` }, body: blob.slice(o, end) });
    if (!pr.ok) throw new Error('Upload ' + pr.status);

}
const blobPath = id => `${SYNC_ROOT}/blobs/${id}.jpg`;
function hashStr(str) { let h = 5381; for (let i = 0; i < str.length; i++) h = (h * 33 ^ str.charCodeAt(i)) >>> 0; return h.toString(36) + ':' + str.length; }
function sigOf(doc) {
  const recs = [doc.project, ...doc.plans, ...doc.points, ...doc.photos].filter(Boolean).map(r => r.id + ':' + (r.updated || 0)).sort();
  return hashStr(recs.join('|'));
}
async function projectDoc(pid) {
  return { format: 'plandoku', version: 1, project: await DB.get('projects', pid),
    plans: await DB.byProject('plans', pid, true), points: await DB.byProject('points', pid, true), photos: await DB.byProject('photos', pid, true) };
}
async function syncAll() {
  const remote = await gList(SYNC_ROOT);
  const ids = new Set((await DB.all('projects')).map(p => p.id));
  for (const name of remote.keys()) { const m = name.match(/^projekt_(.+)\.json$/); if (m) ids.add(m[1]); }
  let changed = false;
  for (const pid of ids) {
    for (let attempt = 0; ; attempt++) {
      try { if (await syncProject(pid, attempt ? 'reload' : remote.get(`projekt_${pid}.json`))) changed = true; break; }
      catch (e) { if (e.message !== 'CONFLICT' || attempt >= 3) throw e; }   // anderes Gerät war schneller → neu zusammenführen
    }
  }
  return changed;
}
async function syncProject(pid, item) {
  const fname = `${SYNC_ROOT}/projekt_${pid}.json`;
  const localSig = sigOf(await projectDoc(pid));
  if (item && item !== 'reload' && item.eTag === await metaGet('etag:' + pid) && localSig === await metaGet('sig:' + pid)) return false; // nichts zu tun
  let changed = false, eTag = null, remoteSig = null;
  if (item) {
    const d = await gDownload(fname);
    if (d) {
      eTag = d.eTag;
      const j = JSON.parse(await d.blob.text());
      remoteSig = sigOf(j);
      for (const [store, arr] of [['plans', j.plans], ['points', j.points], ['photos', j.photos]]) for (const rec of arr || []) if (await mergeRecord(store, rec)) changed = true;
      if (j.project && await mergeRecord('projects', j.project)) changed = true;
    }
  }
  const proj = await DB.get('projects', pid);
  if (!proj) return changed;
  if (proj.deleted) await purgeProjectLocal(pid);
  const live = [...await DB.byProject('plans', pid), ...await DB.byProject('photos', pid)];
  const ids = live.flatMap(r => [r.thumbId, r.blobId]).filter(Boolean);
  // fehlende Bilder herunterladen
  let n = 0;
  for (const id of ids) {
    if (await DB.get('blobs', id)) continue;
    Sync.setProgress(`↓${++n}`);
    const d = await gDownload(blobPath(id));
    if (d) { await DB.put('blobs', { id, type: 'image/jpeg', data: await d.blob.arrayBuffer() }); await metaSet('up:' + id, 1); changed = true; }
  }
  // neue Bilder hochladen
  const todo = []; for (const id of ids) if (!(await metaGet('up:' + id)) && await DB.get('blobs', id)) todo.push(id);
  n = 0;
  for (const id of todo) { Sync.setProgress(`↑${++n}/${todo.length}`); await gUpload(blobPath(id), await DB.getBlob(id)); await metaSet('up:' + id, 1); }
  // Bilder gelöschter Fotos/Pläne in OneDrive entfernen
  const dead = [...await DB.byProject('plans', pid, true), ...await DB.byProject('photos', pid, true)].filter(r => r.deleted).flatMap(r => [r.blobId, r.thumbId]).filter(Boolean);
  for (const id of dead) {
    if (await metaGet('rm:' + id)) continue;
    const r = await gFetch('DELETE', `/root:/${encPath(blobPath(id))}`);
    if (r.ok || r.status === 404) await metaSet('rm:' + id, 1);
  }
  // zusammengeführten Stand hochladen
  const doc = await projectDoc(pid), sig = sigOf(doc);
  if (sig !== remoteSig) {
    const res = await gUpload(fname, new Blob([JSON.stringify(doc)], { type: 'application/json' }), eTag ? { ifMatch: eTag } : { failIfExists: true });
    eTag = res.eTag;
  }
  await metaSet('etag:' + pid, eTag); await metaSet('sig:' + pid, sig);
  return changed;
}

/* ---------------- Einstellungen ---------------- */
async function showSettings() {
  let usage = '';
  try { const e = await navigator.storage.estimate(); usage = `${(e.usage / 1048576).toFixed(0)} MB belegt von ca. ${(e.quota / 1073741824).toFixed(1)} GB`; } catch (e) { }
  let persisted = false; try { persisted = await navigator.storage.persisted(); } catch (e) { }
  const m = openSheet('Einstellungen', `
    <label class="f">Mein Name / Kürzel (für „Aufgenommen von“)</label><input type="text" id="sA" value="${esc(settings.author)}" placeholder="z. B. F. Guggenbichler">
    ${syncInfoHTML()}
    <p class="muted small" style="margin-top:14px">Speicher: ${usage || 'unbekannt'}<br>Dauerhafte Speicherung: ${persisted ? 'aktiv' : 'nicht bestätigt – App zum Home-Bildschirm hinzufügen'}<br>Version ${APP_VERSION}</p>`,
    `<span class="grow"></span><button class="btn primary" id="sOk">Speichern</button>`);
  const saveIds = bindSyncInfo(m.el, () => m.close());
  $('#sOk', m.el).onclick = () => {
    settings.author = $('#sA', m.el).value.trim(); m.close();
    if (saveIds()) { toast('Gespeichert – App startet neu'); setTimeout(() => location.reload(), 800); } else toast('Gespeichert');
  };
}

/* ---------------- Start ---------------- */
document.addEventListener('gesturestart', e => e.preventDefault());
(async () => {
  try { await DB.open(); } catch (e) { view.innerHTML = '<div class="wrap"><p>Speicher nicht verfügbar (privater Modus?).</p></div>'; return; }
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) { }
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
  await Sync.init();
  await showProjects();
  if (!settings.author) setTimeout(showSettings, 400);
})();
</script>
